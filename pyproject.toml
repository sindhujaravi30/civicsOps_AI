[project]
name = "civicsops-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sindhuja Ravi", email = "sindhujatceit101@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
civicsops-ai = "civicsops_ai:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
